openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: models
    description: OpenRouter model configuration
  - name: conversations
    description: Chat conversations per model
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /stats:
    get:
      operationId: getStats
      tags: [models]
      summary: Get aggregate stats across all models
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStats"

  /models:
    get:
      operationId: listModels
      tags: [models]
      summary: List all configured models
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Model"
    post:
      operationId: createModel
      tags: [models]
      summary: Add a new model configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelInput"
      responses:
        "201":
          description: Created model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /models/{id}:
    get:
      operationId: getModel
      tags: [models]
      summary: Get a model configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
    patch:
      operationId: updateModel
      tags: [models]
      summary: Update a model configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: Updated model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
    delete:
      operationId: deleteModel
      tags: [models]
      summary: Delete a model configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /models/{modelId}/conversations:
    get:
      operationId: listModelConversations
      tags: [conversations]
      summary: List conversations for a model
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createModelConversation
      tags: [conversations]
      summary: Create a new conversation for a model
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Model not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /models/{modelId}/conversations/{id}:
    get:
      operationId: getModelConversation
      tags: [conversations]
      summary: Get a conversation with all its messages
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"
    delete:
      operationId: deleteModelConversation
      tags: [conversations]
      summary: Delete a conversation
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

  /models/{modelId}/conversations/{id}/messages:
    get:
      operationId: listModelMessages
      tags: [conversations]
      summary: List messages in a conversation
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendModelMessage
      tags: [conversations]
      summary: Send a message and stream the AI response (SSE)
      parameters:
        - name: modelId
          in: path
          required: true
          schema:
            type: number
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelMessageInput"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppError"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AppError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ModelStats:
      type: object
      properties:
        totalModels:
          type: number
        enabledModels:
          type: number
        totalConversations:
          type: number
        totalMessages:
          type: number
      required:
        - totalModels
        - enabledModels
        - totalConversations
        - totalMessages

    Model:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        modelId:
          type: string
        description:
          type: ["string", "null"]
        temperature:
          type: number
        maxTokens:
          type: number
        systemPrompt:
          type: ["string", "null"]
        topP:
          type: number
        enabled:
          type: boolean
        webSearchEnabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - modelId
        - description
        - temperature
        - maxTokens
        - systemPrompt
        - topP
        - enabled
        - webSearchEnabled
        - createdAt
        - updatedAt

    ModelInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        modelId:
          type: string
          minLength: 1
        description:
          type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
        maxTokens:
          type: number
          minimum: 1
        systemPrompt:
          type: string
        topP:
          type: number
          minimum: 0
          maximum: 1
        enabled:
          type: boolean
        webSearchEnabled:
          type: boolean
      required:
        - name
        - modelId

    ModelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        modelId:
          type: string
          minLength: 1
        description:
          type: string
        temperature:
          type: number
          minimum: 0
          maximum: 2
        maxTokens:
          type: number
          minimum: 1
        systemPrompt:
          type: string
        topP:
          type: number
          minimum: 0
          maximum: 1
        enabled:
          type: boolean
        webSearchEnabled:
          type: boolean

    Conversation:
      type: object
      properties:
        id:
          type: number
        modelId:
          type: number
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - modelId
        - title
        - createdAt

    ConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
      required:
        - title

    ConversationWithMessages:
      type: object
      properties:
        id:
          type: number
        modelId:
          type: number
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - id
        - modelId
        - title
        - createdAt
        - messages

    ChatMessage:
      type: object
      properties:
        id:
          type: number
        conversationId:
          type: number
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    ModelMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
